name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Derle ve test et
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7.0.1

      - name: .NET 10 SDK kur
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Bağımlılıkları geri yükle
        run: dotnet restore Ferah.slnx

      - name: Release derlemesi
        run: dotnet build Ferah.slnx -c Release --no-restore --nologo

      - name: Güvenlik ve regresyon testleri
        run: dotnet run --project tests/Ferah.Tests/Ferah.Tests.csproj -c Release --no-build
